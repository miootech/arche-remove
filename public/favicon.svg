<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    arche.remove favicon — dark rounded-square background so it looks
    consistent on both light and dark browser tab bars.
    Solid amber dot = subject kept; hollow ring = background removed;
    diagonal line = the "cut" action.
  -->
  <defs>
    <linearGradient id="arche-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1b1f"/>
      <stop offset="1" stop-color="#111113"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#arche-bg)"/>
  <rect x="6" y="6" width="20" height="20" rx="4" fill="#e6b87a" opacity="0.16"/>
  <path d="M9 23L23 9" stroke="#e6b87a" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="11" cy="21" r="2.8" fill="#e6b87a"/>
  <circle cx="21" cy="11" r="2.8" fill="none" stroke="#F5F5F7" stroke-width="2.2"/>
</svg>
